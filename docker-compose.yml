
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hybrid-rag-backend
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
    volumes:
      - ./documents:/app/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hybrid-rag-frontend
    environment:
      - BACKEND_URL=http://backend:8000
    expose:
      - "8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

  
  nginx:
    image: nginx:alpine
    container_name: hybrid-rag-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
